name = "mynote-api"
main = "src/index.ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]

# Free plan is sufficient to start: 100k requests/day, 10ms CPU per invocation.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "mynote"
database_id = "REPLACE_WITH_D1_ID"   # `wrangler d1 create mynote`
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "mynote-attachments"

[vars]
FIREBASE_PROJECT_ID = "REPLACE_ME"
APPLE_BUNDLE_ID = "io.mynote.app"
APPLE_ISSUER_ID = "REPLACE_ME"
APPLE_KEY_ID = "REPLACE_ME"
APPLE_ENVIRONMENT = "Production"
GOOGLE_PACKAGE_NAME = "io.mynote.app"
GOOGLE_SA_EMAIL = "REPLACE_ME"
FREE_STORAGE_BYTES = "0"
PAID_STORAGE_BYTES = "1073741824"

# Secrets (set with `wrangler secret put <NAME>`), never in this file:
#   APPLE_PRIVATE_KEY      App Store Connect .p8 contents (ES256)
#   GOOGLE_SA_PRIVATE_KEY  Play service-account private key (RS256)
#   PUBSUB_SHARED_SECRET   Guards the Play RTDN webhook path

[env.staging]
name = "mynote-api-staging"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "mynote-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "migrations"
[[env.staging.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "mynote-attachments-staging"

name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to publish to'
        type: choice
        default: alpha
        options: [alpha, internal]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  test:
    name: Core tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # The sync engine is a plain JVM module, so this runs in seconds.
      - name: Core tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/core/build/reports/tests/

  release:
    name: Publish to Play closed testing
    needs: test
    if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # An AAB, not an APK: Play requires it, and it cuts download size.
      - name: Build release bundle
        run: ./gradlew :app:bundleRelease
        env:
          # Without it Drive backup is hidden and the app is local-only.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_OAUTH_CLIENT_ID }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.chrisphua.mynote
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          # 'alpha' is Play's default closed track. Internal testing does not
          # count towards the 14-day closed test a personal account must run
          # before it may apply for production access, so a tagged release goes
          # straight to the track that starts that clock. Dispatch the workflow
          # by hand with track: internal for a quick smoke test instead.
          track: ${{ inputs.track || 'alpha' }}
          status: completed

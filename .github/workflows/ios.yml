name: iOS

on:
  push:
    branches: [main]
    # Releases are cut by tagging, so a merge to main never ships by itself.
    tags: ['ios-v*']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the toolchain so CI and a developer machine agree. Leaving each to pick
  # its own default is how two failures reached main that no local run could
  # reproduce: a simulator runtime the pinned SDK did not have, then XCUITest's
  # main-actor isolation, which only the older compiler enforced.
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  core-tests:
    name: Core package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain
        run: xcodebuild -version && swift --version
      # No simulator needed: this is where the sync engine is actually verified.
      - name: Test MyNoteCore
        working-directory: ios/MyNoteCore
        run: swift test

  build:
    name: Build app
    needs: core-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'ios/MyNoteCore/Package.swift') }}

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      # Absent on PRs from forks; the app detects this and runs local-only.
      # Absent on PRs from forks. Without it Google Drive is simply not
      # offered; iCloud Drive and local-only still work, so the build is valid.
      - name: Inject Google Drive client id
        working-directory: ios
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            /usr/libexec/PlistBuddy -c "Set :MyNoteGoogleClientID $GOOGLE_CLIENT_ID" MyNote/Info.plist
          else
            echo "No Google client id; Drive backup will be hidden in this build."
          fi

      # Device destination, not simulator: compiling the asset catalog for a
      # simulator SDK needs a matching runtime installed, and the runner image's
      # Xcode and runtimes do not always line up. Nothing here needs to run.
      - name: Build
        working-directory: ios
        run: |
          xcodebuild -project MyNote.xcodeproj -scheme MyNote \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      # The app's own tests need a booted simulator. The device is chosen from
      # whatever the runner actually has rather than hard-coded, because the
      # available models change with the image.
      - name: Test the app
        working-directory: ios
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['name'] for rt,ds in d.items() if 'iOS' in rt for x in ds if x.get('isAvailable')))")
          echo "Testing on $DEVICE"
          xcodebuild test -project MyNote.xcodeproj -scheme MyNote \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    name: Upload to TestFlight
    needs: build
    if: startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: macos-15
    environment: ios-release
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Inject Google Drive client id
        working-directory: ios
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_OAUTH_CLIENT_ID }}
        run: /usr/libexec/PlistBuddy -c "Set :MyNoteGoogleClientID $GOOGLE_CLIENT_ID" MyNote/Info.plist

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Upload build
        working-directory: ios
        run: bundle exec fastlane beta
        env:
          # App Store Connect API key: no 2FA prompts, no shared Apple ID password.
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          # Signing is Xcode-managed; the API key needs App Manager rights so
          # it can create the certificate and profile on the runner.

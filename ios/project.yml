name: MyNote
options:
  bundleIdPrefix: com.chrisphua
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# No third-party dependencies. Removing the backend removed Firebase with it,
# and Google Drive is reached through its REST API directly — so there is no SDK
# to keep current and nothing in the binary we did not write.
packages:
  MyNoteCore:
    path: MyNoteCore

settings:
  base:
    DEVELOPMENT_TEAM: "9ZM956H7Q9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  MyNote:
    type: application
    platform: iOS
    # iPhone and iPad from one target; layout adapts at runtime.
    deploymentTarget: "17.0"
    sources:
      - path: MyNote/Sources
      - path: MyNote/Resources
        buildPhase: resources
    dependencies:
      - package: MyNoteCore
        product: MyNoteCore
    entitlements:
      path: MyNote/MyNote.entitlements
      properties:
        # Backup lives in the user's own iCloud Drive, visible in the Files app.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.chrisphua.MyNote
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.chrisphua.MyNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrisphua.MyNote
        INFOPLIST_FILE: MyNote/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: MyNote/Info.plist
      properties:
        CFBundleDisplayName: MyNote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Left empty in the repo: without it Google Drive is simply not offered,
        # and iCloud plus local-only still work. See docs/DEPLOYMENT.md.
        MyNoteGoogleClientID: ""
        NSUbiquitousContainers:
          iCloud.com.chrisphua.MyNote:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: MyNote
            NSUbiquitousContainerSupportedFolderLevels: Any
        # Google's OAuth callback for installed apps is the reversed client id.
        # Filled in alongside MyNoteGoogleClientID.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.chrisphua.MyNote

  MyNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyNote/Tests
    dependencies:
      - target: MyNote
      - package: MyNoteCore
        product: MyNoteCore

schemes:
  MyNote:
    build:
      targets:
        MyNote: all
        MyNoteTests: [test]
    test:
      targets:
        - MyNoteTests
      gatherCoverageData: true

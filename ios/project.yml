name: MyNote
options:
  bundleIdPrefix: io.mynote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MyNoteCore:
    path: MyNoteCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  MyNote:
    type: application
    platform: iOS
    # iPhone and iPad from one target; layout adapts at runtime.
    deploymentTarget: "17.0"
    sources:
      - path: MyNote/Sources
      - path: MyNote/Resources
        buildPhase: resources
    dependencies:
      - package: MyNoteCore
        product: MyNoteCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mynote.app
        INFOPLIST_FILE: MyNote/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: MyNote/Info.plist
      properties:
        CFBundleDisplayName: MyNote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Sign in with Apple and Google both return through this scheme.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - io.mynote.app

  MyNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyNote/Tests
    dependencies:
      - target: MyNote
      - package: MyNoteCore
        product: MyNoteCore

schemes:
  MyNote:
    build:
      targets:
        MyNote: all
        MyNoteTests: [test]
    test:
      targets:
        - MyNoteTests
      gatherCoverageData: true
